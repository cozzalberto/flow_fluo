 - override /training: default
 - override /dataset: argolight_cropped  #non viene toccato (???)
 - override /generation: flow
 - override /dataset/degradation: no_degradation
 - override /dataset/noise: no_noise

models:
  pretrained_flow:
          #path: "/leonardo_work/IscrC_GOLD-FM_0/cozzani/flow_fluo/experiments/step1_tubulin_w_pt_51200_xxxs_norm_nocenter/checkpoints/training-state-32000.pt"
    path: "/data/cil/alberto/flow_fluo_sc/experiments/step1_argolight/checkpoints/training-state-57600.pt" #/leonardo_work/IscrC_GOLD-FM_0/cozzani/flow_fluo/experiments/step1_tubulin_w_pt_51200_xxxs_norm_nocenter/checkpoints/training-state-32000.pt"
