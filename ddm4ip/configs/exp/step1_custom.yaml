# @package _global_
defaults:
 - /models@models.flow: xxxs_flow_256 # Adjust based on your desired resolution. You can choose between xxs_flow64, xxxs_flowI where I in {32, 64, 96, 128, 256}. I should be equal to your H or W, or near to it
 - override /training: default
 - override /loss: flow_matching
 - override /dataset: my_custom_dataset  # <--- Change this to match the name of your dataset YAML (without .yaml)
 - override /generation: flow

models:
  flow:
    # Uncomment and specify a path if you want to fine-tune from an existing checkpoint
    # pretrained_path: "/path/to/your/checkpoints/network-snapshot-XXXXX.pkl"

optim:
  lr: 0.01

training:
  batch_size: 16
  max_steps: 64000  
  save_every_steps: 6400 
  plot_every_steps: 6400 
  report_every_steps: 6400
  resume: False               #should be True if you want to fine-tune from models.flow.pretrained_path
  save_eval_to_file: True     #save .png of generations every plot_every_steps number of steps
 
evaluate:
  plot_every_steps: 160
  batch_size: 16
  save_eval_to_file: True

exp_name: step1_custom_dataset
