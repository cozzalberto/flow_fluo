hydra:
  run:
    dir: ${training.log_dir}/${exp_name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - exp=step2_argolight_cropped
    - loss.lambda1=0.01,0.05,0.1,0.3,0.7
    - loss.lambda2=5,10,20,40,50
    - training.max_steps=128000
  job:
    name: main
    chdir: null
    override_dirname: exp=step2_argolight_cropped,loss.lambda1=0.01,0.05,0.1,0.3,0.7,loss.lambda2=5,10,20,40,50,training.max_steps=128000
    id: ???
    num: ???
    config_name: main.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /data/cil/alberto/flow_fluo_sc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data/cil/alberto/flow_fluo_sc/ddm4ip/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      exp: step2_argolight_cropped
      loss@loss.aux: flow_matching
      models@models.kernel: direct_kernel
      models@models.pretrained_flow: xxxs_flow_256
      paths: default
      exp_name: null
      generation: flow
      training: default
      loss: null
      optim: null
      dataset: argolight_cropped
      dataset/noise: no_noise
      dataset/degradation: no_degradation
      models: null
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
dataset:
  degradation:
    kind: none
    padding: valid
  noise:
    kind: none
  name: zip
  train_path: /data/cil/alberto/flow_fluo_sc/datasets/corrupt.zip
  test_path: datasets/corrupt.zip
  M: 27.25
  in_channels: 1
  cuda: true
  space_conditioning: false
training:
  seed: 42
  log_dir: ${paths.out_path}
  max_val_batches: 1
  save_eval_to_file: false
  save_first_step: false
  batch_size: 32
  max_steps: 128000
  report_every_steps: 12800
  plot_every_steps: 12800
  save_every_steps: 25600
  checkpoint: null
  num_workers: 4
  train: true
generation:
  num_steps: 32
paths:
  data: ./data
  out_path: ./experiments
models:
  pretrained_flow:
    kind: flow
    channels: 32
    channel_mult:
    - 1
    - 2
    - 3
    - 4
    num_blocks: 1
    attn_resolutions:
    - 32
    dropout: 0.2
    channels_per_head: 16
    path: /data/cil/alberto/flow_fluo_sc/experiments/step1_argolight_alpha12_true2/checkpoints/training-state-57600.pt
  kernel:
    type: direct
    kernel_size: 13
    padding: replicate
    sum_to_one: true
    factor: 1
    learn_output_noise: false
loss:
  aux:
    name: flow_matching
    crop_patch_sizes: null
    n_accum_steps: 1
    scaling_info_pth: /leonardo_work/IscrC_GOLD-FM_0/cozzani/flow_fluo/datasets/psfs/scaling_info.pt
  name: di
  n_inner_steps: 1
  n_accum_steps: 1
  sparse_reg: 0.0
  center_reg: 0.0
  sum_to_one_reg: 0.0
  kernel_path: ''
  noise_level: 1
  lambda1: 0.1
  lambda2: 10
  scaling_info_pth: ''
optim:
  aux:
    lr: 1.0e-05
  kernel:
    lr: 0.0004
noise_level: 1
exp_name: lambda1_${loss.lambda1}_lambda2_${loss.lambda2}
